make_call:
  fields:
    recipient:
      selector:
        entity:
          domain: notify
          integration: telegram_call
    peer:
      example: '@ten_dang_nhap'
      selector:
        text: null
    user_id:
      example: 123456789
      selector:
        number:
          min: 1
          max: 9007199254740991
          mode: box
    video:
      default: false
      selector:
        boolean: null
    mic: &id001
      selector:
        entity:
          domain:
          - camera
          - assist_satellite
    mic_url: &id002
      selector:
        text: null
    camera: &id003
      selector:
        entity:
          domain: camera
    speaker: &id004
      selector:
        entity:
          domain: media_player
    volume: &id005
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: '%'
    connect_now:
      selector:
        select:
          options:
          - mic
          - speaker
          - camera
          mode: list
          multiple: true
    connect:
      selector:
        select:
          options:
          - mic
          - speaker
          - camera
          mode: list
          multiple: true
    message:
      selector:
        text:
          multiline: true
    repeat:
      selector:
        number:
          min: 1
          max: 3
          mode: box
    hangup_after:
      default: false
      selector:
        boolean: null
    pipeline:
      selector:
        text: null
    tts_engine:
      selector:
        entity:
          domain: tts
    language:
      selector:
        text: null
    config_entry_id:
      selector:
        config_entry:
          integration: telegram_call
answer_call:
  fields:
    call_id:
      selector:
        text: null
      description: Bỏ trống = cuộc gọi đến đang đổ chuông (phải có đúng một).
    config_entry_id:
