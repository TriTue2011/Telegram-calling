send_message:
  fields:
    recipient:
      selector:
        entity:
          domain: notify
          integration: telegram_call
    chat_id:
      selector: &id007
        number:
          min: -9007199254740991
          max: 9007199254740991
          mode: box
    peer:
      selector: &id006
        text: null
    message:
      required: true
      example: Xin chào
      selector: &id008
        text:
          multiline: true
    reply_to:
      selector: &id009
        number:
          min: 1
          max: 9007199254740991
          mode: box
    format:
      default: plain
      selector: &id010
        select:
          options:
          - plain
          - markdown
          - html
          mode: dropdown
    config_entry_id:
      selector: *id006
