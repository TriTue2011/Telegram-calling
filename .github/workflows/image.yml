# Dựng ảnh gateway Telegram (đa kiến trúc) lên GHCR khi đẩy thẻ vX: test gateway -> :vX, :X (không chữ v — Supervisor
# của add-on kéo thẻ này) và :latest. Độc lập hoàn toàn với kho Zalo-calling.
name: Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Thẻ cần dựng ảnh (đã tồn tại), ví dụ v0.1.0'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r telegram-gateway/requirements.txt pytest anyio
      - working-directory: telegram-gateway
        run: python -m pytest tests -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./telegram-gateway
          file: ./telegram-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tritue2011/telegram-calling:${{ needs.test.outputs.tag }}
            ghcr.io/tritue2011/telegram-calling:${{ needs.test.outputs.version }}
            ghcr.io/tritue2011/telegram-calling:latest
